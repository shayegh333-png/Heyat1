<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقه هفته وحدت</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { background: white; border-radius: 20px; padding: 30px; max-width: 700px; margin: 0 auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { color: #667eea; text-align: center; margin-bottom: 20px; }
        h3 { color: #333; margin: 20px 0; line-height: 1.8; white-space: pre-line; }
        .timer { background: #ff6b6b; color: white; padding: 15px; border-radius: 10px; text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; font-family: Tahoma; }
        input:focus, textarea:focus { outline: none; border-color: #667eea; }
        button { background: #667eea; color: white; padding: 15px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:hover { background: #5568d3; }
        .option { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: all 0.3s; }
        .option:hover { background: #e9ecef; }
        .option.selected { background: #667eea; color: white; border-color: #5568d3; }
        .progress { background: #e9ecef; height: 8px; border-radius: 4px; margin: 20px 0; }
        .progress-bar { background: #667eea; height: 100%; border-radius: 4px; transition: width 0.3s; }
        .result { text-align: center; padding: 40px; }
        .score { font-size: 48px; color: #28a745; font-weight: bold; margin: 20px 0; }
        .hidden { display: none; }
        .success-msg { background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin: 20px 0; text-align: center; }
        .error-msg { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin: 20px 0; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <!-- بخش ثبت نام -->
        <div id="registration">
            <h1>🎭 مسابقه هفته وحدت</h1>
            <p style="text-align:center; margin-bottom:20px; color:#666;">«نامه‌ای میان دو مذهب»</p>
            <div class="form-group">
                <label>نام:</label>
                <input type="text" id="firstName" required>
            </div>
            <div class="form-group">
                <label>نام خانوادگی:</label>
                <input type="text" id="lastName" required>
            </div>
            <div class="form-group">
                <label>شماره دانشجویی:</label>
                <input type="text" id="studentId" required>
            </div>
            <div class="form-group">
                <label>کد ملی (۱۰ رقم):</label>
                <input type="text" id="nationalId" maxlength="10" required>
            </div>
            <button onclick="startQuiz()">🚀 شروع مسابقه</button>
        </div>

        <!-- بخش سوالات -->
        <div id="quiz" class="hidden">
            <div class="timer" id="timer">⏳ 15:00</div>
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div id="questionsContainer"></div>
        </div>

        <!-- بخش نتیجه -->
        <div id="result" class="hidden">
            <div class="result">
                <h2>🏆 مسابقه تمام شد!</h2>
                <div class="score" id="finalScore">0</div>
                <p style="font-size: 20px;">امتیاز شما از ۱۰۰</p>
                <div id="statusBox"></div>
            </div>
        </div>
    </div>

    <script>
        // ✅ ایمیل شما اینجا قرار گرفته است
        const YOUR_EMAIL = 'shayegh333@gmail.com';
        
        let timeLeft = 15 * 60;
        let timerInterval;
        let currentQ = 0;
        let answers = { userInfo: {}, answers: [] };

        const questions = [
            {
                text: "🔐 مرحله اول: «اولین قدم»\n\nشخصیت اصلی داستان پس از سال‌ها حضور در مصر، تصمیم گرفته برای ایجاد ارتباط میان علمای شیعه و اهل‌سنت اقدامی جدی انجام دهد.\n\nاگر اولین ارتباط با لحنی اشتباه شکل بگیرد، ممکن است طرف مقابل تصور کند هدف، تبلیغ یک مذهب علیه مذهب دیگر است.\n\nتو جای او هستی. کدام مسیر را انتخاب می‌کنی؟",
                options: ["A) ابتدا درباره اختلافات اساسی صحبت می‌کنم", "B) ابتدا روی مشترکات تمرکز می‌کنم", "C) فقط درباره مسائل اجتماعی صحبت می‌کنم", "D) ابتدا منابع طرف مقابل را می‌شناسم"],
                correct: ["C", "D"]
            },
            {
                text: "🧩 مرحله دوم: «یک تصمیم عجیب»\n\nکتب فقهی شیعه در اختیار علمای اهل‌سنت قرار گیرد.\n\nحالا اگر جای شخصیت داستان بودی: چه می‌کردی؟",
                options: ["A) فقط کتاب‌های مشترکات را می‌فرستم", "B) آثار فقهی اصلی را هم می‌فرستم", "C) ابتدا منابع آنها را می‌گیرم", "D) این کار را خطرناک می‌دانم"],
                correct: ["B"]
            },
            {
                text: "🕯️ مرحله سوم: «مشکل واقعی»\n\nطرف مقابل درباره مذهب تو از منابع غیرمعتبر استفاده کرده.\n\nتو هم درباره مذهب او همین مشکل را داری.\n\nحالا یک انتخاب داری:",
                options: ["A) منابعش را رد می‌کنم", "B) ابتدا منابعش را می‌شنوم، بعد منابع خودم", "C) وارد بحث اعتبار منابع نمی‌شوم", "D) موضوع مشخص انتخاب می‌کنیم"],
                correct: ["B", "D"]
            },
            {
                text: "⚠️ مرحله چهارم: «حساس‌ترین انتخاب»\n\nاگر طرف مقابل مطلبی گفت که با باور تو سازگار نیست، چه می‌کنی؟",
                options: ["A) همان لحظه مخالفت می‌کنم", "B) گفت‌وگو را متوقف می‌کنم", "C) اجازه می‌دهم کامل بگوید، بعد محترمانه پاسخ می‌دهم", "D) می‌خواهم درباره موضوعات اختلافی صحبت نکنیم"],
                correct: ["C"]
            },
            {
                text: "🔎 مرحله پنجم: «تو برای چه چیزی تلاش می‌کنی؟»",
                options: ["A) معرفی درست مذهب خودمان", "B) پیدا کردن نقاط مشترک", "C) شناخت متقابل با حفظ اختلافات", "D) ایجاد جبهه مشترک"],
                correct: ["C"]
            },
            {
                text: "🧠 مرحله ششم: «چرا مجله رسالة الإسلام مهم بود؟»",
                options: ["A) چون اختلافات مذهبی را حذف می‌کرد", "B) چون فضا برای دیدگاه‌های علمی مختلف فراهم می‌کرد", "C) چون باعث برتری یک مذهب می‌شد", "D) چون بحث‌های مذهبی را حذف می‌کرد"],
                correct: ["B"]
            },
            {
                text: "🕵🏻 مرحله هفتم: «هویت شخصیت اصلی»\n\n• سال‌ها در مصر زندگی کرد\n• برای تقریب مذاهب تلاش می‌کرد\n• با آیت‌الله بروجردی ارتباط داشت\n• در شکل‌گیری دارالتقریب نقش محوری داشت",
                options: ["A) شیخ محمود شلتوت", "B) محمدتقی قمی", "C) عبدالمجید سلیم", "D) آیت‌الله بروجردی"],
                correct: ["B"]
            },
            {
                text: "😳 مرحله هشتم: «شخصیت دوم»\n\n• عالم شیعه\n• حمایت از تقریب\n• ارتباط با الازهر\n• تأکید بر شناخت فقه اهل‌سنت",
                options: ["A) محمدتقی قمی", "B) شیخ محمود شلتوت", "C) آیت‌الله سیدحسین بروجردی", "D) محمدجواد مغنیه"],
                correct: ["C"]
            },
            {
                text: "🔥 مرحله نهایی: «فتوای تاریخی درباره مذهب جعفری»\n\nاین شخص چه کسی است؟",
                options: ["A) عبدالمجید سلیم", "B) شیخ محمود شلتوت", "C) احمد حسن الباقوری", "D) محمدتقی قمی"],
                correct: ["B"]
            }
        ];

        function startQuiz() {
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const studentId = document.getElementById('studentId').value.trim();
            const nationalId = document.getElementById('nationalId').value.trim();

            if (!firstName || !lastName || !studentId || !nationalId) {
                alert('❌ لطفاً همه فیلدها را پر کنید');
                return;
            }
            if (!/^\d{10}$/.test(nationalId)) {
                alert('❌ کد ملی باید ۱۰ رقم باشد');
                return;
            }

            answers.userInfo = { firstName, lastName, studentId, nationalId };
            document.getElementById('registration').classList.add('hidden');
            document.getElementById('quiz').classList.remove('hidden');
            showQuestion();
            startTimer();
        }

        function showQuestion() {
            const q = questions[currentQ];
            const progress = ((currentQ) / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';

            let html = `<h3>${q.text}</h3><div class="options">`;
            q.options.forEach((opt, i) => {
                html += `<div class="option" onclick="selectOption(this, '${opt[0]}')">${opt}</div>`;
            });
            html += `</div><button onclick="nextQuestion()">سوال بعد ←</button>`;

            document.getElementById('questionsContainer').innerHTML = html;
        }

        function selectOption(el, letter) {
            document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            answers.answers[currentQ] = letter;
        }

        function nextQuestion() {
            if (!answers.answers[currentQ]) {
                alert('❌ لطفاً یک گزینه انتخاب کنید');
                return;
            }
            currentQ++;
            if (currentQ < questions.length) {
                showQuestion();
            } else {
                showEssayQuestion();
            }
        }

        function showEssayQuestion() {
            document.getElementById('questionsContainer').innerHTML = `
                <h3>🏆 فینال: «وحدت یعنی چه؟»</h3>
                <p style="margin: 15px 0; line-height: 1.8;">
                    در حداکثر ۵۰ کلمه توضیح دهید چگونه می‌توان با حفظ باورهای مذهبی خود، با پیرو مذهب دیگر همکاری و برادری داشت.
                </p>
                <textarea id="essayAnswer" rows="6" placeholder="پاسخ شما..."></textarea>
                <button onclick="finishQuiz()">🏁 پایان مسابقه و ارسال نتایج</button>
            `;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                document.getElementById('timer').textContent = `⏳ ${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
                
                if (timeLeft <= 60) {
                    document.getElementById('timer').style.background = '#dc3545';
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                }
            }, 1000);
        }

        async function finishQuiz() {
            clearInterval(timerInterval);
            
            let totalScore = 0;
            questions.forEach((q, i) => {
                if (q.correct.includes(answers.answers[i])) totalScore += 10;
            });

            const essay = document.getElementById('essayAnswer')?.value || '';
            if (essay.length > 50) totalScore += 20; // امتیاز تقریبی برای پاسخ تشریحی

            document.getElementById('quiz').classList.add('hidden');
            document.getElementById('result').classList.remove('hidden');
            document.getElementById('finalScore').textContent = totalScore;

            const statusBox = document.getElementById('statusBox');
            statusBox.innerHTML = '<div class="success-msg">⏳ در حال ارسال نتایج...</div>';

            try {
                await sendResults(totalScore, essay);
                statusBox.innerHTML = '<div class="success-msg">✅ نتایج با موفقیت برای برگزارکننده ارسال شد!</div>';
            } catch (err) {
                statusBox.innerHTML = '<div class="error-msg">❌ خطا در ارسال. لطفاً اینترنت خود را بررسی کنید.</div>';
            }
        }

        async function sendResults(score, essay) {
            const formData = new FormData();
            formData.append('_subject', `نتیجه مسابقه - ${answers.userInfo.firstName} ${answers.userInfo.lastName}`);
            formData.append('نام', answers.userInfo.firstName);
            formData.append('نام خانوادگی', answers.userInfo.lastName);
            formData.append('شماره دانشجویی', answers.userInfo.studentId);
            formData.append('کد ملی', answers.userInfo.nationalId);
            formData.append('امتیاز', score + ' از ۱۰۰');
            formData.append('پاسخ سوالات', answers.answers.join(', '));
            formData.append('پاسخ تشریحی', essay);
            formData.append('_template', 'table');
            formData.append('_captcha', 'false');

            await fetch(`https://formsubmit.co/ajax/${YOUR_EMAIL}`, {
                method: 'POST',
                body: formData
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مسابقه هفته وحدت - نسخه Debug</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background: #f0f2f5; padding: 20px; }
        .container { background: white; border-radius: 15px; padding: 30px; max-width: 700px; margin: 0 auto; }
        h1 { color: #667eea; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { background: #667eea; color: white; padding: 15px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; margin-top: 10px; }
        .hidden { display: none; }
        .debug-box { background: #fff3cd; color: #856404; padding: 15px; border-radius: 8px; margin: 20px 0; font-size: 13px; font-family: monospace; white-space: pre-wrap; direction: ltr; text-align: left; word-break: break-all; }
        .error-box { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin: 20px 0; }
        .success-box { background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin: 20px 0; }
        .test-btn { background: #ffc107; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 صفحه تست اتصال به تلگرام</h1>
        
        <p style="margin: 20px 0; line-height: 1.8;">
            این صفحه برای تست اتصال بات به تلگرام است.
            <br>روی دکمه زیر کلیک کن تا یک پیام تست به تلگرام شما ارسال شود.
        </p>

        <button onclick="testConnection()" class="test-btn">📨 ارسال پیام تست به تلگرام</button>

        <div id="resultBox"></div>
    </div>

    <script>
        // ⚠️ این دو مقدار را چک کن
        const BOT_TOKEN = '8525091515:AAFeyfYOzN2jRjYj-KldFQ0Bbz47zL__rvs';
        const ADMIN_CHAT_ID = '5963345588';

        async function testConnection() {
            const resultBox = document.getElementById('resultBox');
            resultBox.innerHTML = '<div class="debug-box">⏳ در حال ارسال پیام تست...</div>';

            const message = `✅ پیام تست از GitHub Pages\n\nاگر این پیام را می‌بینی، یعنی اتصال بات کار می‌کند!`;

            try {
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                
                resultBox.innerHTML += `\n\n📡 URL: ${url}`;
                resultBox.innerHTML += `\n🆔 Chat ID: ${ADMIN_CHAT_ID}`;

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: ADMIN_CHAT_ID,
                        text: message
                    })
                });

                const data = await response.json();
                
                if (data.ok) {
                    resultBox.innerHTML = `<div class="success-box">✅ موفق! پیام به تلگرام ارسال شد.<br><br>Chat ID: ${data.result.chat.id}<br>Message ID: ${data.result.message_id}</div>`;
                } else {
                    let errorText = `<div class="error-box">❌ خطا از تلگرام:<br><br>`;
                    errorText += `کد: ${data.error_code}<br>`;
                    errorText += `توضیح: ${data.description}<br><br>`;
                    
                    if (data.description.includes('chat not found')) {
                        errorText += `💡 <b>راه‌حل:</b> اول با بات /start بزن!`;
                    } else if (data.description.includes('Unauthorized')) {
                        errorText += `💡 <b>راه‌حل:</b> توکن بات اشتباه است. از BotFather توکن جدید بگیر.`;
                    } else if (data.description.includes('blocked')) {
                        errorText += `💡 <b>راه‌حل:</b> شما بات را بلاک کرده‌اید. Unblock کن.`;
                    }
                    
                    errorText += `</div>`;
                    resultBox.innerHTML = errorText;
                }
                
                resultBox.innerHTML += `<div class="debug-box">📦 پاسخ کامل API:\n${JSON.stringify(data, null, 2)}</div>`;
                
            } catch (err) {
                resultBox.innerHTML = `<div class="error-box">❌ خطای شبکه:<br>${err.message}<br><br>احتمالاً GitHub Pages یا API تلگرام فیلتر است.</div>`;
            }
        }
    </script>
</body>
</html>

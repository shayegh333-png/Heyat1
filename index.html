<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تست ارسال به تلگرام</title>
    <style>
        body { font-family: Tahoma; background: #f0f2f5; padding: 20px; text-align: center; }
        .box { background: white; padding: 30px; border-radius: 15px; max-width: 500px; margin: 50px auto; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        button { background: #667eea; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin: 10px; }
        button:hover { background: #5568d3; }
        #result { margin-top: 20px; padding: 15px; border-radius: 8px; text-align: right; direction: ltr; font-family: monospace; white-space: pre-wrap; word-break: break-all; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .loading { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔧 تست ارسال پیام به تلگرام</h1>
        <p>روی دکمه زیر کلیک کن:</p>
        <button onclick="sendTest()">📨 ارسال پیام تست</button>
        <div id="result"></div>
    </div>

    <script>
        const BOT_TOKEN = '8525091515:AAFeyfYOzN2jRjYj-KldFQ0Bbz47zL__rvs';
        const CHAT_ID = '5963345588';

        async function sendTest() {
            const result = document.getElementById('result');
            result.className = 'loading';
            result.textContent = '⏳ در حال ارسال...';

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: '✅ سلام! این یک پیام تست است.\n\nاگر این پیام را در تلگرام می‌بینی، یعنی همه چیز درست کار می‌کند! 🎉'
                    })
                });

                const data = await response.json();
                
                if (data.ok) {
                    result.className = 'success';
                    result.textContent = '✅ موفق!\n\nپیام به تلگرام ارسال شد.\n\nChat ID: ' + data.result.chat.id + '\nMessage ID: ' + data.result.message_id;
                } else {
                    result.className = 'error';
                    result.textContent = '❌ خطا:\n\nکد: ' + data.error_code + '\nتوضیح: ' + data.description + '\n\nکل پاسخ:\n' + JSON.stringify(data, null, 2);
                }
            } catch (err) {
                result.className = 'error';
                result.textContent = '❌ خطای شبکه:\n\n' + err.message + '\n\nاحتمالاً API تلگرام فیلتر است.';
            }
        }
    </script>
</body>
</html>

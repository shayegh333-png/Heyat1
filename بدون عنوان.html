<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقه هفته وحدت</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 700px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #667eea; text-align: center; margin-bottom: 20px; }
        h3 { color: #333; margin: 20px 0; line-height: 1.8; white-space: pre-line; }
        .timer {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: Tahoma, sans-serif;
        }
        input:focus, textarea:focus { outline: none; border-color: #667eea; }
        button {
            background: #667eea;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background: #5568d3; }
        .option {
            background: #f8f9fa;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .option:hover { background: #e9ecef; }
        .option.selected { background: #667eea; color: white; border-color: #5568d3; }
        .progress {
            background: #e9ecef;
            height: 8px;
            border-radius: 4px;
            margin: 20px 0;
        }
        .progress-bar {
            background: #667eea;
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }
        .result { text-align: center; padding: 40px; }
        .score { font-size: 48px; color: #28a745; font-weight: bold; margin: 20px 0; }
        .hidden { display: none; }
        .success-msg {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }
        .error-msg {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
            font-size: 14px;
            word-break: break-word;
        }
        .debug-box {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 13px;
            font-family: monospace;
            white-space: pre-wrap;
            direction: ltr;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ثبت نام -->
        <div id="registration">
            <h1>🎭 مسابقه هفته وحدت</h1>
            <p style="text-align:center; margin-bottom:20px; color:#666;">«نامه‌ای میان دو مذهب»</p>
            <div class="form-group">
                <label>نام:</label>
                <input type="text" id="firstName" required>
            </div>
            <div class="form-group">
                <label>نام خانوادگی:</label>
                <input type="text" id="lastName" required>
            </div>
            <div class="form-group">
                <label>شماره دانشجویی:</label>
                <input type="text" id="studentId" required>
            </div>
            <div class="form-group">
                <label>کد ملی (۱۰ رقم):</label>
                <input type="text" id="nationalId" maxlength="10" required>
            </div>
            <button onclick="startQuiz()">🚀 شروع مسابقه</button>
        </div>

        <!-- سوالات -->
        <div id="quiz" class="hidden">
            <div class="timer" id="timer">⏳ 15:00</div>
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div id="questionsContainer"></div>
        </div>

        <!-- نتیجه -->
        <div id="result" class="hidden">
            <div class="result">
                <h2>🏆 مسابقه تمام شد!</h2>
                <div class="score" id="finalScore">0</div>
                <p style="font-size: 20px;">امتیاز شما از ۱۰۰</p>
                <div id="statusBox"></div>
                <div id="debugBox" class="debug-box"></div>
            </div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = '8525091515:AAFeyfYOzN2jRjYj-KldFQ0Bbz47zL__rvs';
        const ADMIN_CHAT_ID = '5963345588';

        let timeLeft = 15 * 60;
        let timerInterval;
        let currentQ = 0;
        let answers = { userInfo: {} };

        const questions = [
            {
                text: "🔐 مرحله اول: «اولین قدم»\n\nشخصیت اصلی داستان پس از سال‌ها حضور در مصر، تصمیم گرفته برای ایجاد ارتباط میان علمای شیعه و اهل‌سنت اقدامی جدی انجام دهد.\n\nاگر اولین ارتباط با لحنی اشتباه شکل بگیرد، ممکن است طرف مقابل تصور کند هدف، تبلیغ یک مذهب علیه مذهب دیگر است.\n\nتو جای او هستی. کدام مسیر را انتخاب می‌کنی؟",
                options: [
                    "A) ابتدا درباره اختلافات اساسی صحبت می‌کنم",
                    "B) ابتدا روی مشترکات تمرکز می‌کنم",
                    "C) فقط درباره مسائل اجتماعی صحبت می‌کنم",
                    "D) ابتدا منابع طرف مقابل را می‌شناسم"
                ],
                correct: ["C", "D"]
            },
            {
                text: "🧩 مرحله دوم: «یک تصمیم عجیب»\n\nکتب فقهی شیعه در اختیار علمای اهل‌سنت قرار گیرد.\n\nحالا اگر جای شخصیت داستان بودی: چه می‌کردی؟",
                options: [
                    "A) فقط کتاب‌های مشترکات را می‌فرستم",
                    "B) آثار فقهی اصلی را هم می‌فرستم",
                    "C) ابتدا منابع آنها را می‌گیرم",
                    "D) این کار را خطرناک می‌دانم"
                ],
                correct: ["B"]
            },
            {
                text: "🕯️ مرحله سوم: «مشکل واقعی»\n\nطرف مقابل درباره مذهب تو از منابع غیرمستخدم استفاده کرده.\n\nتو هم درباره مذهب او همین مشکل را داری.\n\nحالا یک انتخاب داری:",
                options: [
                    "A) منابعش را رد می‌کنم",
                    "B) ابتدا منابعش را می‌شنوم، بعد منابع خودم",
                    "C) وارد بحث اعتبار منابع نمی‌شوم",
                    "D) موضوع مشخص انتخاب می‌کنیم"
                ],
                correct: ["B", "D"]
            },
            {
                text: "⚠️ مرحله چهارم: «حساس‌ترین انتخاب»\n\nاگر طرف مقابل مطلبی گفت که با باور تو سازگار نیست، چه می‌کنی؟",
                options: [
                    "A) همان لحظه مخالفت می‌کنم",
                    "B) گفت‌وگو را متوقف می‌کنم",
                    "C) اجازه می‌دهم کامل بگوید، بعد محترمانه پاسخ می‌دهم",
                    "D) می‌خواهم درباره موضوعات اختلافی صحبت نکنیم"
                ],
                correct: ["C"]
            },
            {
                text: "🔎 مرحله پنجم: «تو برای چه چیزی تلاش می‌کنی؟»",
                options: [
                    "A) معرفی درست مذهب خودمان",
                    "B) پیدا کردن نقاط مشترک",
                    "C) شناخت متقابل با حفظ اختلافات",
                    "D) ایجاد جبهه مشترک"
                ],
                correct: ["C"]
            },
            {
                text: "🧠 مرحله ششم: «چرا مجله رسالة الإسلام مهم بود؟»",
                options: [
                    "A) چون اختلافات مذهبی را حذف می‌کرد",
                    "B) چون فضا برای دیدگاه‌های علمی مختلف فراهم می‌کرد",
                    "C) چون باعث برتری یک مذهب می‌شد",
                    "D) چون بحث‌های مذهبی را حذف می‌کرد"
                ],
                correct: ["B"]
            },
            {
                text: "🕵🏻 مرحله هفتم: «هویت شخصیت اصلی»\n\n• سال‌ها در مصر زندگی کرد\n• برای تقریب مذاهب تلاش می‌کرد\n• با آیت‌الله بروجردی ارتباط داشت\n• در شکل‌گیری دارالتقریب نقش محوری داشت",
                options: [
                    "A) شیخ محمود شلتوت",
                    "B) محمدتقی قمی",
                    "C) عبدالمجید سلیم",
                    "D) آیت‌الله بروجردی"
                ],
                correct: ["B"]
            },
            {
                text: "😳 مرحله هشتم: «شخصیت دوم»\n\n• عالم شیعه\n• حمایت از تقریب\n• ارتباط با الازهر\n• تأکید بر شناخت فقه اهل‌سنت",
                options: [
                    "A) محمدتقی قمی",
                    "B) شیخ محمود شلتوت",
                    "C) آیت‌الله سیدحسین بروجردی",
                    "D) محمدجواد مغنیه"
                ],
                correct: ["C"]
            },
            {
                text: "🔥 مرحله نهایی: «فتوای تاریخی درباره مذهب جعفری»\n\nاین شخص چه کسی است؟",
                options: [
                    "A) عبدالمجید سلیم",
                    "B) شیخ محمود شلتوت",
                    "C) احمد حسن الباقوری",
                    "D) محمدتقی قمی"
                ],
                correct: ["B"]
            }
        ];

        function startQuiz() {
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const studentId = document.getElementById('studentId').value.trim();
            const nationalId = document.getElementById('nationalId').value.trim();

            if (!firstName || !lastName || !studentId || !nationalId) {
                alert('❌ لطفاً همه فیلدها را پر کنید');
                return;
            }
            if (!/^\d{10}$/.test(nationalId)) {
                alert('❌ کد ملی باید ۱۰ رقم باشد');
                return;
            }

            answers.userInfo = { firstName, lastName, studentId, nationalId };
            document.getElementById('registration').classList.add('hidden');
            document.getElementById('quiz').classList.remove('hidden');
            showQuestion();
            startTimer();
        }

        function showQuestion() {
            const q = questions[currentQ];
            const progress = ((currentQ) / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';

            let html = `<h3>${q.text}</h3><div class="options">`;
            q.options.forEach((opt, i) => {
                html += `<div class="option" onclick="selectOption(this, '${opt[0]}')">${opt}</div>`;
            });
            html += `</div><button onclick="nextQuestion()">سوال بعد ←</button>`;

            document.getElementById('questionsContainer').innerHTML = html;
        }

        function selectOption(el, letter) {
            document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            answers[currentQ] = letter;
        }

        function nextQuestion() {
            if (!answers[currentQ]) {
                alert('❌ لطفاً یک گزینه انتخاب کنید');
                return;
            }
            currentQ++;
            if (currentQ < questions.length) {
                showQuestion();
            } else {
                showEssayQuestion();
            }
        }

        function showEssayQuestion() {
            document.getElementById('questionsContainer').innerHTML = `
                <h3>🏆 فینال: «وحدت یعنی چه؟»</h3>
                <p style="margin: 15px 0; line-height: 1.8;">
                    در حداکثر ۵۰ کلمه توضیح دهید چگونه می‌توان با حفظ باورهای مذهبی خود، با پیرو مذهب دیگر همکاری و برادری داشت.
                </p>
                <textarea id="essayAnswer" rows="6" placeholder="پاسخ شما..."></textarea>
                <button onclick="finishQuiz()">🏁 پایان مسابقه</button>
            `;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                document.getElementById('timer').textContent = 
                    `⏳ ${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
                
                if (timeLeft <= 60) {
                    document.getElementById('timer').style.background = '#dc3545';
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                }
            }, 1000);
        }

        async function finishQuiz() {
            clearInterval(timerInterval);
            
            let totalScore = 0;
            questions.forEach((q, i) => {
                if (q.correct.includes(answers[i])) totalScore += 10;
            });

            const essay = document.getElementById('essayAnswer')?.value || '';
            if (essay.length > 50) totalScore += 20;

            document.getElementById('quiz').classList.add('hidden');
            document.getElementById('result').classList.remove('hidden');
            document.getElementById('finalScore').textContent = totalScore;

            const statusBox = document.getElementById('statusBox');
            const debugBox = document.getElementById('debugBox');
            
            statusBox.innerHTML = '<div class="success-msg">⏳ در حال ارسال نتایج...</div>';
            debugBox.textContent = '';

            try {
                const result = await sendToTelegram(totalScore, essay);
                debugBox.textContent = 'Response from Telegram API:\n' + JSON.stringify(result, null, 2);
                
                if (result.ok) {
                    statusBox.innerHTML = '<div class="success-msg">✅ نتایج با موفقیت به تلگرام ارسال شد!</div>';
                } else {
                    statusBox.innerHTML = `<div class="error-msg">❌ خطا: ${result.description}</div>`;
                }
            } catch (err) {
                debugBox.textContent = 'Error:\n' + err.message + '\n\nThis usually means CORS issue.\nPlease upload this file to a real server (like Netlify Drop).';
                statusBox.innerHTML = '<div class="error-msg">❌ خطا در ارسال. لطفاً فایل را روی سرور آپلود کنید (Netlify Drop)</div>';
            }
        }

        async function sendToTelegram(score, essay) {
            let message = `🎯 *نتیجه جدید مسابقه هفته وحدت*\n\n`;
            message += `👤 *نام:* ${answers.userInfo.firstName} ${answers.userInfo.lastName}\n`;
            message += `🎓 *شماره دانشجویی:* \`${answers.userInfo.studentId}\`\n`;
            message += `🆔 *کد ملی:* \`${answers.userInfo.nationalId}\`\n\n`;
            message += `📊 *امتیاز:* ${score} از ۱۰۰\n\n`;
            message += `📝 *پاسخ‌ها:*\n`;
            
            questions.forEach((q, i) => {
                const userAns = answers[i] || '-';
                const correct = q.correct.join('/');
                const status = q.correct.includes(userAns) ? '✅' : '❌';
                message += `${status} سوال ${i+1}: ${userAns} (صحیح: ${correct})\n`;
            });
            
            message += `\n💬 *پاسخ تشریحی:*\n${essay || '(بدون پاسخ)'}`;

            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: ADMIN_CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            });
            
            return await response.json();
        }
    </script>
</body>
</html>
